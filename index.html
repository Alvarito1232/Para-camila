<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efecto Romántico - Cascada TikTok</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="canvasTikTok"></canvas>

    <script>
        const canvas = document.getElementById('canvasTikTok');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        // Fuegos artificiales de líneas radiales exactos a los de tu captura
        class FuegoArtificial {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radio = 0;
                this.radioMax = Math.random() * 50 + 60;
                this.alpha = 1;
                this.velocidadExpansion = 2.5;
            }

            actualizar() {
                this.radio += this.velocidadExpansion;
                this.alpha -= 0.025; // Se desvanece suavemente
            }

            dibujar() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                const rayos = 24; // Cantidad de líneas del fuego artificial
                for (let i = 0; i < rayos; i++) {
                    const angulo = (i * 2 * Math.PI) / rayos;
                    const x1 = Math.cos(angulo) * (this.radio * 0.4);
                    const y1 = Math.sin(angulo) * (this.radio * 0.4);
                    const x2 = Math.cos(angulo) * this.radio;
                    const y2 = Math.sin(angulo) * this.radio;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        let fuegos = [];
        let desplazamientoGlobal = 0;
        let tiempoInicio = Date.now();
        let modoVerde = false;

        // Generar fuegos artificiales periódicamente
        setInterval(() => {
            if (fuegos.length < 4) {
                const rx = Math.random() * (window.innerWidth - 200) + 100;
                const ry = Math.random() * (window.innerHeight - 200) + 100;
                const colorFuego = modoVerde ? '#00e676' : '#ff1744';
                fuegos.push(new FuegoArtificial(rx, ry, colorFuego));
            }
        }, 1200);

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // A los 7 segundos exactos cambia al color verde
            let tiempoTranscurrido = Date.now() - tiempoInicio;
            if (tiempoTranscurrido > 7000) {
                modoVerde = true;
            }

            const colorActual = modoVerde ? '#00e676' : '#ff1744';
            const textoFondo = "My Love";

            // Velocidad en x1 (suave y fluida)
            desplazamientoGlobal += 1.2;

            ctx.font = 'bold 15px sans-serif';
            ctx.textBaseline = 'top';

            const espacioY = 28;
            const espacioX = 130;
            const filasTotales = Math.ceil(window.innerHeight / espacioY) + 5;
            const columnasTotales = Math.ceil(window.innerWidth / espacioX) + 2;

            // Dibujar efecto cascada (cada columna tiene un desfase de caída para dejar espacios negros)
            for (let c = 0; c < columnasTotales; c++) {
                // Desfase matemático único por columna para lograr el efecto de escalera/cascada
                let desplazamientoColumna = (c * 37) % 150; 
                let posYColumna = (desplazamientoGlobal + desplazamientoColumna) % (filasTotales * espacioY);

                let posX = c * espacioX;

                for (let f = -1; f < filasTotales; f++) {
                    let posY = (f * espacioY) + (posYColumna - espacioY);

                    // Solo pintamos si está dentro de la pantalla para optimizar
                    if (posY > -30 && posY < window.innerHeight + 30) {
                        ctx.fillStyle = colorActual;
                        ctx.globalAlpha = 0.5;
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = colorActual;
                        ctx.fillText(textoFondo, posX, posY);
                    }
                }
            }

            // Texto Central estático: "I Love You! ❤️"
            ctx.globalAlpha = 1.0;
            let tamanoTexto = Math.min(window.innerWidth / 8, 52);
            ctx.font = `bold ${tamanoTexto}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 25;
            ctx.shadowColor = colorActual;
            ctx.fillStyle = '#ffffff';

            let textoCentro = "I Love You! ❤️";
            ctx.fillText(textoCentro, window.innerWidth / 2, window.innerHeight / 2);

            // Actualizar y dibujar los fuegos artificiales radiales
            for (let i = fuegos.length - 1; i >= 0; i--) {
                fuegos[i].actualizar();
                fuegos[i].dibujar();
                if (fuegos[i].alpha <= 0) {
                    fuegos.fuegos = fuegos.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
