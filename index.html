<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Te Amo - Matrix Romántico Optimizado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="canvasMatrix"></canvas>

    <script>
        const canvas = document.getElementById('canvasMatrix');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        // Clase para corazones flotantes optimizados y más abundantes
        class CorazonFlotante {
            constructor() {
                this.reiniciar();
            }
            reiniciar() {
                this.x = Math.random() * window.innerWidth;
                this.y = window.innerHeight + 60;
                this.tamano = Math.random() * 14 + 8;
                this.velocidadY = Math.random() * 1.2 + 0.8;
                this.angulo = Math.random() * Math.PI * 2;
                this.alpha = Math.random() * 0.6 + 0.3;
            }
            actualizar() {
                this.y -= this.velocidadY;
                this.angulo += 0.025;
                this.x += Math.sin(this.angulo) * 0.6;
                if (this.y < -40) this.reiniciar();
            }
            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#ff2a85';
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff69b4';
                
                // Dibujar forma de corazón suave
                ctx.beginPath();
                let t = this.tamano;
                ctx.moveTo(0, t / 4);
                ctx.bezierCurveTo(-t / 2, -t / 2, -t, t / 3, 0, t);
                ctx.bezierCurveTo(t, t / 3, t / 2, -t / 2, 0, t / 4);
                ctx.fill();
                ctx.restore();
            }
        }

        // Crear una buena cantidad de corazones para que luzca lleno
        let corazones = [];
        const cantidadCorazones = Math.floor(window.innerWidth < 600 ? 35 : 55);
        for (let i = 0; i < cantidadCorazones; i++) {
            let c = new CorazonFlotante();
            c.y = Math.random() * window.innerHeight; // Distribuidos desde el inicio
            corazones.push(c);
        }

        // Configuración Matrix ultradensa adaptada para celulares y PC
        const esCelular = window.innerWidth < 600;
        const espacioX = esCelular ? 75 : 95; // Columnas mucho más juntas para eliminar espacios negros
        const espacioY = 28;  // Espaciado vertical más compacto
        let columnas = [];

        function inicializarColumnas() {
            columnas = [];
            const totalCols = Math.ceil(window.innerWidth / espacioX) + 2;
            for (let c = 0; c < totalCols; c++) {
                columnas.push({
                    x: c * espacioX,
                    y: Math.random() * window.innerHeight - window.innerHeight,
                    longitudBloque: 40 // Tiras largas sin baches
                });
            }
        }
        inicializarColumnas();
        window.addEventListener('resize', inicializarColumnas);

        let tonoMatiz = 330; // Mantiene el tono rosado/fucsia elegante con transición suave

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // Transición suave de color fluida
            tonoMatiz += 0.2;
            if (tonoMatiz > 360) tonoMatiz = 0;
            const colorDinamico = `hsl(${tonoMatiz}, 100%, 70%)`;

            const textoFondo = "Te Amo";
            const velocidadBase = 2.4; // Velocidad fluida y agradable

            // Definir fuente nítida según pantalla
            const tamanoFuenteTexto = esCelular ? 17 : 20;
            ctx.font = `bold ${tamanoFuenteTexto}px sans-serif`;
            ctx.textBaseline = 'top';

            // Dibujar lluvia de palabras Matrix densa y nítida
            for (let col of columnas) {
                col.y += velocidadBase;

                if (col.y > window.innerHeight) {
                    col.y = - (col.longitudBloque * espacioY);
                }

                for (let i = 0; i < col.longitudBloque; i++) {
                    let posY = col.y + (i * espacioY);

                    if (posY > -40 && posY < window.innerHeight + 40) {
                        // La primera palabra de la columna brilla más nítida (cabeza de matrix)
                        if (i === 0) {
                            ctx.fillStyle = '#ffffff';
                            ctx.globalAlpha = 0.95;
                            ctx.shadowBlur = 8;
                        } else {
                            ctx.fillStyle = colorDinamico;
                            ctx.globalAlpha = 0.7;
                            ctx.shadowBlur = 4;
                        }
                        ctx.shadowColor = colorDinamico;
                        ctx.fillText(textoFondo, col.x, posY);
                    }
                }
            }

            // Dibujar y actualizar corazones flotantes
            for (let corazon of corazones) {
                corazon.actualizar();
                corazon.dibujar();
            }

            // Frase central fija y hermosa: "Te Amo ❤️"
            ctx.globalAlpha = 1.0;
            let tamanoCentral = Math.min(window.innerWidth / 7, 48);
            ctx.font = `bold ${tamanoCentral}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20;
            ctx.shadowColor = colorDinamico;
            ctx.fillStyle = '#ffffff';

            ctx.fillText("Te Amo ❤️", window.innerWidth / 2, window.innerHeight / 2);

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
