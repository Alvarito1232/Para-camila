<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efecto Romántico - TikTok Idéntico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="canvasTikTok"></canvas>

    <script>
        const canvas = document.getElementById('canvasTikTok');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        // Fuegos artificiales radiales idénticos a los del video
        class FuegoArtificial {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radio = 0;
                this.radioMax = 70;
                this.alpha = 1;
            }

            actualizar() {
                this.radio += 2;
                this.alpha -= 0.02;
            }

            dibujar() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;

                const rayos = 22;
                for (let i = 0; i < rayos; i++) {
                    const angulo = (i * 2 * Math.PI) / rayos;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angulo) * 10, Math.sin(angulo) * 10);
                    ctx.lineTo(Math.cos(angulo) * this.radio, Math.sin(angulo) * this.radio);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        let fuegos = [];
        let tiempoInicio = Date.now();
        let modoVerde = false;

        // Estallidos de fuegos artificiales intermitentes
        setInterval(() => {
            if (fuegos.length < 3) {
                const rx = Math.random() * (window.innerWidth - 150) + 75;
                const ry = Math.random() * (window.innerHeight - 150) + 75;
                const colorFuego = modoVerde ? '#00e676' : '#ff1744';
                fuegos.push(new FuegoArtificial(rx, ry, colorFuego));
            }
        }, 1400);

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // A los 7 segundos exactos cambia al color verde (como en el video)
            let tiempoTranscurrido = Date.now() - tiempoInicio;
            if (tiempoTranscurrido > 7000) {
                modoVerde = true;
            }

            const colorActual = modoVerde ? '#00e676' : '#ff1744';
            const textoFondo = "My Love";

            ctx.font = 'bold 14px sans-serif';
            ctx.textBaseline = 'top';

            const espacioY = 22;  // Filas más juntas y continuas como el video
            const espacioX = 95;   // Columnas más cercanas
            const columnasTotales = Math.ceil(window.innerWidth / espacioX) + 2;
            const filasPorColumna = Math.ceil(window.innerHeight / espacioY) + 4;

            // Dibujar cada columna con su propio desplazamiento vertical independiente (efecto cascada fluido)
            let tiempoActual = Date.now() * 0.04; // Velocidad x1 suave

            for (let c = 0; c < columnasTotales; c++) {
                let posX = c * espacioX;
                // Cada columna cae a una velocidad ligeramente distinta o desfasada
                let offsetColumna = (c * 45) + (tiempoActual * (1.2 + (c % 3) * 0.2));

                for (let f = 0; f < filasPorColumna; f++) {
                    let posY = (f * espacioY) + (offsetColumna % (filasPorColumna * espacioY)) - espacioY;

                    ctx.fillStyle = colorActual;
                    ctx.globalAlpha = 0.5;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = colorActual;
                    ctx.fillText(textoFondo, posX, posY);
                }
            }

            // Texto central estático con la frase e icono del video: "I Love You! ❤️"
            ctx.globalAlpha = 1.0;
            let tamanoTexto = Math.min(window.innerWidth / 8, 52);
            ctx.font = `bold ${tamanoTexto}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20;
            ctx.shadowColor = colorActual;
            ctx.fillStyle = '#ffffff';

            ctx.fillText("I Love You! ❤️", window.innerWidth / 2, window.innerHeight / 2);

            // Actualizar fuegos artificiales
            for (let i = fuegos.length - 1; i >= 0; i--) {
                fuegos[i].actualizar();
                fuegos[i].dibujar();
                if (fuegos[i].alpha <= 0) {
                    fuegos.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
