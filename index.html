<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I Love You - TikTok Effect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="canvasTikTok"></canvas>

    <script>
        const canvas = document.getElementById('canvasTikTok');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        class Explosion {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.particulas = [];
                for (let i = 0; i < 45; i++) {
                    const angulo = Math.random() * Math.PI * 2;
                    const velocidad = Math.random() * 6 + 2;
                    this.particulas.push({
                        x: 0, y: 0,
                        vx: Math.cos(angulo) * velocidad,
                        vy: Math.sin(angulo) * velocidad,
                        alpha: 1,
                        decend: Math.random() * 0.02 + 0.012
                    });
                }
            }
            actualizar() {
                for (let p of this.particulas) {
                    p.x += p.vx; p.y += p.vy; p.alpha -= p.decend;
                }
            }
            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                for (let p of this.particulas) {
                    if (p.alpha <= 0) continue;
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        let explosiones = [];
        let desplazamientoY = 0;
        let tiempoInicio = Date.now();
        let modoVerde = false; // Controla el cambio automático de color a los 7 segundos

        // Generador de fuegos artificiales intermitentes
        setInterval(() => {
            if (explosiones.length < 5) {
                const rx = Math.random() * window.innerWidth;
                const ry = Math.random() * window.innerHeight;
                // Coincide el color de la explosión con el estado actual (Rojo o Verde)
                const colorFuego = modoVerde ? '#00e676' : '#ff1744';
                explosiones.push(new Explosion(rx, ry, colorFuego));
            }
        }, 900);

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // Verificar si ya transcurrieron los 7 segundos (7000 ms)
            let tiempoTranscurrido = Date.now() - tiempoInicio;
            if (tiempoTranscurrido > 7000) {
                modoVerde = true;
            }

            // Colores exactos según la fase: Primeros 7s en rojo, luego cambia a verde puro
            const colorActual = modoVerde ? '#00e676' : '#ff1744';
            const textoFondo = "My Love";

            // Velocidad fija configurada en x3
            desplazamientoY += 4.5 * 3;
            if (desplazamientoY > 35) desplazamientoY = 0;

            ctx.font = 'bold 14px sans-serif';
            ctx.textBaseline = 'top';

            const espacioY = 30;
            const espacioX = 135;
            const filasTotales = Math.ceil(window.innerHeight / espacioY) + 4;
            const columnasTotales = Math.ceil(window.innerWidth / espacioX) + 2;

            // Dibujar las columnas de palabras cayendo a velocidad x3
            for (let f = -1; f < filasTotales; f++) {
                let posY = (f * espacioY) + desplazamientoY - espacioY;
                let desplazamientoFila = (f % 2 === 0) ? 0 : 40;

                for (let c = 0; c < columnasTotales; c++) {
                    let posX = (c * espacioX) + desplazamientoFila;

                    ctx.fillStyle = colorActual;
                    ctx.globalAlpha = 0.45;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = colorActual;
                    ctx.fillText(textoFondo, posX, posY);
                }
            }

            // Frase central fija: "I Love You! ❤️" con brillo adaptado
            ctx.globalAlpha = 1.0;
            let tamanoTexto = Math.min(window.innerWidth / 8, 52);
            ctx.font = `bold ${tamanoTexto}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20;
            ctx.shadowColor = colorActual;
            ctx.fillStyle = '#ffffff';

            let textoCentro = "I Love You! ❤️";
            ctx.fillText(textoCentro, window.innerWidth / 2, window.innerHeight / 2);

            // Renderizar partículas de fuegos artificiales
            for (let i = explosiones.length - 1; i >= 0; i--) {
                explosiones[i].actualizar();
                explosiones[i].dibujar();
                if (explosiones[i].particulas.every(p => p.alpha <= 0)) {
                    explosiones.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
