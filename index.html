<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efecto Matrix Romántico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="canvasMatrix"></canvas>

    <script>
        const canvas = document.getElementById('canvasMatrix');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        // Fuegos artificiales radiales
        class FuegoArtificial {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radio = 0;
                this.alpha = 1;
            }

            actualizar() {
                this.radio += 2.5;
                this.alpha -= 0.02;
            }

            dibujar() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;

                const rayos = 22;
                for (let i = 0; i < rayos; i++) {
                    const angulo = (i * 2 * Math.PI) / rayos;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angulo) * 10, Math.sin(angulo) * 10);
                    ctx.lineTo(Math.cos(angulo) * this.radio, Math.sin(angulo) * this.radio);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        let fuegos = [];
        let tiempoInicio = Date.now();
        let modoVerde = false;

        // Generar fuegos artificiales intermitentes
        setInterval(() => {
            if (fuegos.length < 3) {
                const rx = Math.random() * (window.innerWidth - 150) + 75;
                const ry = Math.random() * (window.innerHeight - 150) + 75;
                const colorFuego = modoVerde ? '#00e676' : '#ff1744';
                fuegos.push(new FuegoArtificial(rx, ry, colorFuego));
            }
        }, 1400);

        // Configuración estilo Matrix con palabras más grandes
        const espacioX = 140; // Separación horizontal para que se noten las columnas estilo Matrix
        const espacioY = 32;  // Espacio vertical entre palabras grandes
        let columnas = [];

        function inicializarColumnas() {
            columnas = [];
            const totalCols = Math.ceil(window.innerWidth / espacioX) + 2;
            for (let c = 0; c < totalCols; c++) {
                columnas.push({
                    x: c * espacioX,
                    y: (Math.random() * -1000) - 200,
                    velocidad: 2.2 + (Math.random() * 0.8), // Velocidad fluida tipo x1
                    longitudBloque: 14 // Cantidad de palabras en la columna estilo código
                });
            }
        }
        inicializarColumnas();
        window.addEventListener('resize', inicializarColumnas);

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // A los 7 segundos exactos cambia al color verde estilo Matrix
            let tiempoTranscurrido = Date.now() - tiempoInicio;
            if (tiempoTranscurrido > 7000) {
                modoVerde = true;
            }

            const colorActual = modoVerde ? '#00e676' : '#ff1744';
            const textoFondo = "My Love";

            // Palabras más grandes estilo Matrix
            ctx.font = 'bold 20px sans-serif';
            ctx.textBaseline = 'top';

            // Dibujar columnas al estilo Matrix
            for (let col of columnas) {
                col.y += col.velocidad;

                // Reiniciar columna arriba cuando sale de la pantalla
                if (col.y > window.innerHeight + 100) {
                    col.y = - (col.longitudBloque * espacioY) - (Math.random() * 500);
                    col.velocidad = 2.2 + (Math.random() * 0.8);
                }

                for (let i = 0; i < col.longitudBloque; i++) {
                    let posY = col.y + (i * espacioY);

                    if (posY > -50 && posY < window.innerHeight + 50) {
                        // Dar efecto de brillo mayor a la primera palabra de la columna (cabeza del Matrix)
                        if (i === col.longitudBloque - 1) {
                            ctx.fillStyle = '#ffffff';
                            ctx.globalAlpha = 0.9;
                            ctx.shadowBlur = 10;
                        } else {
                            ctx.fillStyle = colorActual;
                            ctx.globalAlpha = 0.6;
                            ctx.shadowBlur = 5;
                        }
                        ctx.shadowColor = colorActual;
                        ctx.fillText(textoFondo, col.x, posY);
                    }
                }
            }

            // Frase central fija: "I Love You! ❤️"
            ctx.globalAlpha = 1.0;
            let tamanoTexto = Math.min(window.innerWidth / 8, 52);
            ctx.font = `bold ${tamanoTexto}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 25;
            ctx.shadowColor = colorActual;
            ctx.fillStyle = '#ffffff';

            ctx.fillText("I Love You! ❤️", window.innerWidth / 2, window.innerHeight / 2);

            // Actualizar fuegos artificiales
            for (let i = fuegos.length - 1; i >= 0; i--) {
                fuegos[i].actualizar();
                fuegos[i].dibujar();
                if (fuegos[i].alpha <= 0) {
                    fuegos.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
