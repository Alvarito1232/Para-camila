<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lluvia de Te Amo - Matrix Romántico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Panel de control flotante idéntico al de tu referencia */
        #panelControl {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            color: #ff758c;
            z-index: 10;
            width: 220px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #panelControl label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ff758c;
        }
        #panelControl input[type="range"] {
            width: 100%;
            margin-bottom: 12px;
            accent-color: #ff1744;
        }
        #panelControl input[type="color"] {
            width: 100%;
            height: 32px;
            border: none;
            border-radius: 5px;
            background: transparent;
            cursor: pointer;
            margin-bottom: 12px;
        }
        #panelControl input[type="text"] {
            width: 100%;
            padding: 6px 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="panelControl">
        <label>Velocidad</label>
        <input type="range" id="inputVelocidad" min="1" max="8" step="0.5" value="3.5">

        <label>Color Principal</label>
        <input type="color" id="inputColor" value="#ff1744">

        <label>Texto Fondo</label>
        <input type="text" id="inputTexto" value="Te Amo">
    </div>

    <canvas id="canvasMatrix"></canvas>

    <script>
        const canvas = document.getElementById('canvasMatrix');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        // Referencias de los controles del panel
        const inputVelocidad = document.getElementById('inputVelocidad');
        const inputColor = document.getElementById('inputColor');
        const inputTexto = document.getElementById('inputTexto');

        // Fuegos artificiales radiales
        class FuegoArtificial {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radio = 0;
                this.alpha = 1;
            }

            actualizar() {
                this.radio += 3.0;
                this.alpha -= 0.02;
            }

            dibujar() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 14;
                ctx.shadowColor = this.color;

                const rayos = 22;
                for (let i = 0; i < rayos; i++) {
                    const angulo = (i * 2 * Math.PI) / rayos;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angulo) * 10, Math.sin(angulo) * 10);
                    ctx.lineTo(Math.cos(angulo) * this.radio, Math.sin(angulo) * this.radio);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        let fuegos = [];

        // Generar fuegos artificiales periódicamente
        setInterval(() => {
            if (fuegos.length < 3) {
                const rx = Math.random() * (window.innerWidth - 150) + 75;
                const ry = Math.random() * (window.innerHeight - 150) + 75;
                fuegos.push(new FuegoArtificial(rx, ry, inputColor.value));
            }
        }, 1300);

        // Configuración Matrix densa (lleno total sin huecos grandes)
        const espacioX = 110; 
        const espacioY = 32;  
        let columnas = [];

        function inicializarColumnas() {
            columnas = [];
            const totalCols = Math.ceil(window.innerWidth / espacioX) + 2;
            for (let c = 0; c < totalCols; c++) {
                columnas.push({
                    x: c * espacioX,
                    y: Math.random() * window.innerHeight - window.innerHeight,
                    longitudBloque: 35
                });
            }
        }
        inicializarColumnas();
        window.addEventListener('resize', inicializarColumnas);

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            const colorActual = inputColor.value;
            const textoFondo = inputTexto.value || "Te Amo";
            const velocidadBase = parseFloat(inputVelocidad.value);

            ctx.font = 'bold 22px sans-serif';
            ctx.textBaseline = 'top';

            // Dibujar columnas Matrix densas
            for (let col of columnas) {
                col.y += velocidadBase;

                if (col.y > window.innerHeight) {
                    col.y = - (col.longitudBloque * espacioY);
                }

                for (let i = 0; i < col.longitudBloque; i++) {
                    let posY = col.y + (i * espacioY);

                    if (posY > -50 && posY < window.innerHeight + 50) {
                        if (i === 0) {
                            ctx.fillStyle = '#ffffff';
                            ctx.globalAlpha = 0.9;
                            ctx.shadowBlur = 10;
                        } else {
                            ctx.fillStyle = colorActual;
                            ctx.globalAlpha = 0.65;
                            ctx.shadowBlur = 5;
                        }
                        ctx.shadowColor = colorActual;
                        ctx.fillText(textoFondo, col.x, posY);
                    }
                }
            }

            // Frase central fija destacada
            ctx.globalAlpha = 1.0;
            let tamanoTexto = Math.min(window.innerWidth / 8, 52);
            ctx.font = `bold ${tamanoTexto}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 25;
            ctx.shadowColor = colorActual;
            ctx.fillStyle = '#ffffff';

            ctx.fillText(`${textoFondo} ❤️`, window.innerWidth / 2, window.innerHeight / 2);

            // Actualizar fuegos artificiales
            for (let i = fuegos.length - 1; i >= 0; i--) {
                fuegos[i].actualizar();
                fuegos[i].dibujar();
                if (fuegos[i].alpha <= 0) {
                    fuegos.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
