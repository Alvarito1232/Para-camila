<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efecto Romántico Pro - Estilo TikTok</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }

        canvas { display: block; width: 100%; height: 100%; }

        #panel-control {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 15px;
            border-radius: 10px;
            color: #ffffff;
            font-size: 13px;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            width: 210px;
        }

        .control-grupo {
            margin-bottom: 10px;
        }

        .control-grupo:last-child {
            margin-bottom: 0;
        }

        .control-grupo label {
            display: block;
            margin-bottom: 4px;
            color: #ff80ab;
            font-weight: 600;
        }

        .control-grupo input[type="range"] {
            width: 100%;
            accent-color: #ff1744;
            cursor: pointer;
        }

        .control-grupo input[type="color"] {
            width: 100%;
            height: 28px;
            border: none;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
        }

        .control-grupo input[type="text"] {
            width: 100%;
            padding: 5px 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .control-grupo input[type="text"]:focus {
            border-color: #ff1744;
        }
    </style>
</head>
<body>

    <div id="panel-control">
        <div class="control-grupo">
            <label>Velocidad</label>
            <input type="range" id="inputVelocidad" min="1" max="8" step="0.5" value="4">
        </div>
        <div class="control-grupo">
            <label>Color Centro</label>
            <input type="color" id="inputColor" value="#ff1744">
        </div>
        <div class="control-grupo">
            <label>Texto</label>
            <input type="text" id="inputTexto" value="Te Amo">
        </div>
    </div>

    <canvas id="canvasTikTok"></canvas>

    <script>
        const canvas = document.getElementById('canvasTikTok');
        const ctx = canvas.getContext('2d');

        const inputVelocidad = document.getElementById('inputVelocidad');
        const inputColor = document.getElementById('inputColor');
        const inputTexto = document.getElementById('inputTexto');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        class Explosion {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.particulas = [];
                for (let i = 0; i < 40; i++) {
                    const angulo = Math.random() * Math.PI * 2;
                    const velocidad = Math.random() * 6 + 2;
                    this.particulas.push({
                        x: 0,
                        y: 0,
                        vx: Math.cos(angulo) * velocidad,
                        vy: Math.sin(angulo) * velocidad,
                        alpha: 1,
                        decend: Math.random() * 0.025 + 0.015
                    });
                }
            }

            actualizar() {
                for (let p of this.particulas) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decend;
                }
            }

            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                for (let p of this.particulas) {
                    if (p.alpha <= 0) continue;
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        let explosiones = [];
        let desplazamientoY = 0;
        let tonoColor = 0; // Para hacer la transición cíclica entre rojo, verde, etc.

        setInterval(() => {
            if (explosiones.length < 6) {
                const rx = Math.random() * window.innerWidth;
                const ry = Math.random() * window.innerHeight;
                // Colores aleatorios para las explosiones (rojo, verde, rosa)
                const coloresEx = ['#ff1744', '#00e676', '#ff4081', '#ffffff'];
                const colAleatorio = coloresEx[Math.floor(Math.random() * coloresEx.length)];
                explosiones.push(new Explosion(rx, ry, colAleatorio));
            }
        }, 800);

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            const velocidadInput = parseFloat(inputVelocidad.value);
            const colorCentro = inputColor.value;
            const textoActual = inputTexto.value || "Te Amo";

            // Velocidad de desplazamiento rápida como en el video
            desplazamientoY += 3.5 * velocidadInput;
            if (desplazamientoY > 50) desplazamientoY = 0;

            // Transición automática de color para el fondo (Cambia de rojo a verde y otros)
            tonoColor += 1.5 * velocidadInput;
            
            ctx.font = 'bold 14px sans-serif';
            ctx.textBaseline = 'top';

            const espacioY = 30;
            const espacioX = 130;
            const filasTotales = Math.ceil(window.innerHeight / espacioY) + 4;
            const columnasTotales = Math.ceil(window.innerWidth / espacioX) + 2;

            for (let f = -1; f < filasTotales; f++) {
                let posY = (f * espacioY) + desplazamientoY - espacioY;
                let desplazamientoFila = (f % 2 === 0) ? 0 : 40;

                for (let c = 0; c < columnasTotales; c++) {
                    let posX = (c * espacioX) + desplazamientoFila;

                    // Cada columna/fila tiene un color dinámico basado en su posición y el tiempo (Rojo ➔ Verde ➔ Rosa)
                    let hueColumna = (tonoColor + (c * 15) + (f * 10)) % 360;
                    // HSL permite alternar perfectamente entre rojos (~0) y verdes (~120)
                    let colorDinamicoFondo = `hsl(${hueColumna}, 90%, 55%)`;

                    ctx.fillStyle = colorDinamicoFondo;
                    ctx.globalAlpha = 0.45;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = colorDinamicoFondo;
                    ctx.fillText(textoActual, posX, posY);
                }
            }

            // Frase principal destacada en el centro
            ctx.globalAlpha = 1.0;
            ctx.font = `bold ${Math.min(window.innerWidth / 8, 55)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20;
            ctx.shadowColor = colorCentro;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(textoActual, window.innerWidth / 2, window.innerHeight / 2);

            // Explosiones de partículas
            for (let i = explosiones.length - 1; i >= 0; i--) {
                explosiones[i].actualizar();
                explosiones[i].dibujar();
                if (explosiones[i].particulas.every(p => p.alpha <= 0)) {
                    explosiones.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
