<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efecto Romántico Pro - Estilo TikTok</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }

        #panel-control {
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 15px;
            border-radius: 10px;
            color: #ffffff;
            font-size: 13px;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            width: 210px;
        }

        .control-grupo { margin-bottom: 10px; }
        .control-grupo:last-child { margin-bottom: 0; }
        .control-grupo label { display: block; margin-bottom: 4px; color: #ff80ab; font-weight: 600; }
        .control-grupo input[type="range"] { width: 100%; accent-color: #ff1744; cursor: pointer; }
        .control-grupo input[type="color"] { width: 100%; height: 28px; border: none; border-radius: 4px; background: transparent; cursor: pointer; }
        .control-grupo input[type="text"] {
            width: 100%; padding: 5px 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px; color: #fff; font-size: 12px; outline: none;
        }
    </style>
</head>
<body>

    <div id="panel-control">
        <div class="control-grupo">
            <label>Velocidad</label>
            <input type="range" id="inputVelocidad" min="1" max="8" step="0.5" value="4.5">
        </div>
        <div class="control-grupo">
            <label>Color Principal</label>
            <input type="color" id="inputColor" value="#ff1744">
        </div>
        <div class="control-grupo">
            <label>Texto Fondo</label>
            <input type="text" id="inputTextoFondo" value="My Love">
        </div>
    </div>

    <canvas id="canvasTikTok"></canvas>

    <script>
        const canvas = document.getElementById('canvasTikTok');
        const ctx = canvas.getContext('2d');

        const inputVelocidad = document.getElementById('inputVelocidad');
        const inputColor = document.getElementById('inputColor');
        const inputTextoFondo = document.getElementById('inputTextoFondo');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        class Explosion {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.particulas = [];
                for (let i = 0; i < 45; i++) {
                    const angulo = Math.random() * Math.PI * 2;
                    const velocidad = Math.random() * 6 + 2;
                    this.particulas.push({
                        x: 0, y: 0,
                        vx: Math.cos(angulo) * velocidad,
                        vy: Math.sin(angulo) * velocidad,
                        alpha: 1,
                        decend: Math.random() * 0.02 + 0.012
                    });
                }
            }
            actualizar() {
                for (let p of this.particulas) {
                    p.x += p.vx; p.y += p.vy; p.alpha -= p.decend;
                }
            }
            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                for (let p of this.particulas) {
                    if (p.alpha <= 0) continue;
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        let explosiones = [];
        let desplazamientoY = 0;
        let tiempoInicio = Date.now();
        let modoVerde = false; // Controla el cambio de color a los 7 segundos

        setInterval(() => {
            if (explosiones.length < 5) {
                const rx = Math.random() * window.innerWidth;
                const ry = Math.random() * window.innerHeight;
                // Si ya pasaron los 7 segundos, los fuegos artificiales también salen verdes
                const colorFuego = modoVerde ? '#00e676' : inputColor.value;
                explosiones.push(new Explosion(rx, ry, colorFuego));
            }
        }, 900);

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            const velocidadInput = parseFloat(inputVelocidad.value);
            const textoFondo = inputTextoFondo.value || "My Love";

            // Verificar si ya pasaron 7 segundos (7000 milisegundos) para cambiar a verde
            let tiempoTranscurrido = Date.now() - tiempoInicio;
            if (tiempoTranscurrido > 7000) {
                modoVerde = true;
            }

            // Definir el color actual según el tiempo (7s en rojo/fucsia, luego cambia a verde)
            let colorActualFondo = modoVerde ? '#00e676' : inputColor.value;

            // Velocidad rápida de caída de las columnas
            desplazamientoY += 4 * velocidadInput;
            if (desplazamientoY > 35) desplazamientoY = 0;

            ctx.font = 'bold 14px sans-serif';
            ctx.textBaseline = 'top';

            const espacioY = 30;
            const espacioX = 135;
            const filasTotales = Math.ceil(window.innerHeight / espacioY) + 4;
            const columnasTotales = Math.ceil(window.innerWidth / espacioX) + 2;

            for (let f = -1; f < filasTotales; f++) {
                let posY = (f * espacioY) + desplazamientoY - espacioY;
                let desplazamientoFila = (f % 2 === 0) ? 0 : 40;

                for (let c = 0; c < columnasTotales; c++) {
                    let posX = (c * espacioX) + desplazamientoFila;

                    ctx.fillStyle = colorActualFondo;
                    ctx.globalAlpha = 0.45;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = colorActualFondo;
                    ctx.fillText(textoFondo, posX, posY);
                }
            }

            // Frase central idéntica a tus capturas: "I Love You!" + ❤️
            ctx.globalAlpha = 1.0;
            let tamanoTexto = Math.min(window.innerWidth / 8, 52);
            ctx.font = `bold ${tamanoTexto}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20;
            ctx.shadowColor = colorActualFondo;
            ctx.fillStyle = '#ffffff';

            let textoCentro = "I Love You! ❤️";
            ctx.fillText(textoCentro, window.innerWidth / 2, window.innerHeight / 2);

            // Explosiones
            for (let i = explosiones.length - 1; i >= 0; i--) {
                explosiones[i].actualizar();
                explosiones[i].dibujar();
                if (explosiones[i].particulas.every(p => p.alpha <= 0)) {
                    explosiones.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
