<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efecto Romántico - Cascada Exacta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="canvasTikTok"></canvas>

    <script>
        const canvas = document.getElementById('canvasTikTok');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        // Fuegos artificiales radiales idénticos a los del video
        class FuegoArtificial {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radio = 0;
                this.alpha = 1;
            }

            actualizar() {
                this.radio += 2.2;
                this.alpha -= 0.022;
            }

            dibujar() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                const rayos = 20;
                for (let i = 0; i < rayos; i++) {
                    const angulo = (i * 2 * Math.PI) / rayos;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angulo) * 8, Math.sin(angulo) * 8);
                    ctx.lineTo(Math.cos(angulo) * this.radio, Math.sin(angulo) * this.radio);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        let fuegos = [];
        let tiempoInicio = Date.now();
        let modoVerde = false;

        // Generar fuegos artificiales intermitentes
        setInterval(() => {
            if (fuegos.length < 3) {
                const rx = Math.random() * (window.innerWidth - 150) + 75;
                const ry = Math.random() * (window.innerHeight - 150) + 75;
                const colorFuego = modoVerde ? '#00e676' : '#ff1744';
                fuegos.push(new FuegoArtificial(rx, ry, colorFuego));
            }
        }, 1300);

        // Configuración de las columnas de texto cayendo en cascada exacta
        const espacioX = 110; // Distancia horizontal entre columnas
        const espacioY = 24;  // Altura entre cada palabra "My Love"
        let columnas = [];

        function inicializarColumnas() {
            columnas = [];
            const totalCols = Math.ceil(window.innerWidth / espacioX) + 2;
            for (let c = 0; c < totalCols; c++) {
                columnas.push({
                    x: c * espacioX,
                    y: (Math.random() * -800) - 100, // Posición inicial aleatoria arriba fuera de pantalla
                    velocidad: 1.8 + (Math.random() * 0.6), // Velocidad uniforme estilo x1
                    longitudBloque: 18 // Cantidad de palabras que conforman la tira vertical
                });
            }
        }
        inicializarColumnas();
        window.addEventListener('resize', inicializarColumnas);

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // A los 7 segundos exactos cambia al color verde (como se ve en el video)
            let tiempoTranscurrido = Date.now() - tiempoInicio;
            if (tiempoTranscurrido > 7000) {
                modoVerde = true;
            }

            const colorActual = modoVerde ? '#00e676' : '#ff1744';
            const textoFondo = "My Love";

            ctx.font = 'bold 13px sans-serif';
            ctx.textBaseline = 'top';

            // Actualizar y dibujar cada columna de forma independiente (crea los espacios negros y la cascada perfecta)
            for (let col of columnas) {
                col.y += col.velocidad;

                // Si la columna pasa por completo la pantalla, se reinicia arriba con un espacio aleatorio
                if (col.y > window.innerHeight + 100) {
                    col.y = - (col.longitudBloque * espacioY) - (Math.random() * 400);
                    col.velocidad = 1.8 + (Math.random() * 0.6);
                }

                for (let i = 0; i < col.longitudBloque; i++) {
                    let posY = col.y + (i * espacioY);

                    // Solo renderizar si está dentro del área visible para mantener fluidez
                    if (posY > -50 && posY < window.innerHeight + 50) {
                        ctx.fillStyle = colorActual;
                        ctx.globalAlpha = 0.55;
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = colorActual;
                        ctx.fillText(textoFondo, col.x, posY);
                    }
                }
            }

            // Frase central fija: "I Love You! ❤️"
            ctx.globalAlpha = 1.0;
            let tamanoTexto = Math.min(window.innerWidth / 8, 52);
            ctx.font = `bold ${tamanoTexto}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 22;
            ctx.shadowColor = colorActual;
            ctx.fillStyle = '#ffffff';

            ctx.fillText("I Love You! ❤️", window.innerWidth / 2, window.innerHeight / 2);

            // Actualizar fuegos artificiales
            for (let i = fuegos.length - 1; i >= 0; i--) {
                fuegos[i].actualizar();
                fuegos[i].dibujar();
                if (fuegos[i].alpha <= 0) {
                    fuegos.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
