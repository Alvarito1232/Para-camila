<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efecto Matrix Te Amo con Corazones</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000000; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="canvasMatrix"></canvas>

    <script>
        const canvas = document.getElementById('canvasMatrix');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        // Fuegos artificiales radiales con destellos rosados
        class FuegoArtificial {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radio = 0;
                this.alpha = 1;
            }

            actualizar() {
                this.radio += 2.8;
                this.alpha -= 0.02;
            }

            dibujar() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                const rayos = 24;
                for (let i = 0; i < rayos; i++) {
                    const angulo = (i * 2 * Math.PI) / rayos;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angulo) * 10, Math.sin(angulo) * 10);
                    ctx.lineTo(Math.cos(angulo) * this.radio, Math.sin(angulo) * this.radio);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // Corazones flotantes que suben suavemente como en tu video
        class CorazonFlotante {
            constructor() {
                this.reiniciar();
            }
            reiniciar() {
                this.x = Math.random() * window.innerWidth;
                this.y = window.innerHeight + 50;
                this.tamano = Math.random() * 15 + 10;
                this.velocidadY = Math.random() * 1.5 + 1;
                this.oscilacionX = Math.random() * 2 - 1;
                this.angulo = Math.random() * Math.PI * 2;
                this.alpha = Math.random() * 0.5 + 0.3;
            }
            actualizar() {
                this.y -= this.velocidadY;
                this.angulo += 0.03;
                this.x += Math.sin(this.angulo) * 0.8;
                if (this.y < -50) this.reiniciar();
            }
            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#ff4081';
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff69b4';
                
                // Dibujar forma de corazón con curvas de Bezier
                ctx.beginPath();
                let t = this.tamano;
                ctx.moveTo(0, t / 4);
                ctx.bezierCurveTo(-t / 2, -t / 2, -t, t / 3, 0, t);
                ctx.bezierCurveTo(t, t / 3, t / 2, -t / 2, 0, t / 4);
                ctx.fill();
                ctx.restore();
            }
        }

        let fuegos = [];
        let corazones = [];
        for (let i = 0; i < 25; i++) {
            corazones.push(new CorazonFlotante());
        }

        // Generar fuegos artificiales rosados/fucsia periódicamente
        setInterval(() => {
            if (fuegos.length < 3) {
                const rx = Math.random() * (window.innerWidth - 150) + 75;
                const ry = Math.random() * (window.innerHeight - 150) + 75;
                fuegos.push(new FuegoArtificial(rx, ry, '#ff1493'));
            }
        }, 1400);

        // Configuración Matrix para llenar toda la pantalla
        const espacioX = 115;
        const espacioY = 32;
        let columnas = [];

        function inicializarColumnas() {
            columnas = [];
            const totalCols = Math.ceil(window.innerWidth / espacioX) + 2;
            for (let c = 0; c < totalCols; c++) {
                columnas.push({
                    x: c * espacioX,
                    y: Math.random() * window.innerHeight - window.innerHeight,
                    longitudBloque: 35
                });
            }
        }
        inicializarColumnas();
        window.addEventListener('resize', inicializarColumnas);

        let tonoMatiz = 330; // Inicia en tonos rosados/fucsia

        function animar() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // Transición suave y continua de colores (paleta de colores cambiando de forma fluida)
            tonoMatiz += 0.25;
            if (tonoMatiz > 360) tonoMatiz = 0;
            const colorDinamico = `hsl(${tonoMatiz}, 100%, 65%)`;

            const textoFondo = "Te Amo";
            const velocidadBase = 2.8; // Velocidad exacta y fluida

            ctx.font = 'bold 22px sans-serif';
            ctx.textBaseline = 'top';

            // Dibujar columnas Matrix densas
            for (let col of columnas) {
                col.y += velocidadBase;

                if (col.y > window.innerHeight) {
                    col.y = - (col.longitudBloque * espacioY);
                }

                for (let i = 0; i < col.longitudBloque; i++) {
                    let posY = col.y + (i * espacioY);

                    if (posY > -50 && posY < window.innerHeight + 50) {
                        if (i === 0) {
                            ctx.fillStyle = '#ffffff';
                            ctx.globalAlpha = 0.9;
                            ctx.shadowBlur = 10;
                        } else {
                            ctx.fillStyle = colorDinamico;
                            ctx.globalAlpha = 0.65;
                            ctx.shadowBlur = 5;
                        }
                        ctx.shadowColor = colorDinamico;
                        ctx.fillText(textoFondo, col.x, posY);
                    }
                }
            }

            // Actualizar y dibujar los corazones flotantes rosados
            for (let corazon of corazones) {
                corazon.actualizar();
                corazon.dibujar();
            }

            // Frase central fija destacada: "Te Amo ❤️"
            ctx.globalAlpha = 1.0;
            let tamanoTexto = Math.min(window.innerWidth / 8, 52);
            ctx.font = `bold ${tamanoTexto}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 25;
            ctx.shadowColor = colorDinamico;
            ctx.fillStyle = '#ffffff';

            ctx.fillText("Te Amo ❤️", window.innerWidth / 2, window.innerHeight / 2);

            // Actualizar fuegos artificiales
            for (let i = fuegos.length - 1; i >= 0; i--) {
                fuegos[i].actualizar();
                fuegos[i].dibujar();
                if (fuegos[i].alpha <= 0) {
                    fuegos.splice(i, 1);
                }
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
